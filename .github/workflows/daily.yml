name: Telegram stats

on:
  schedule:
    # Не ровно в :00 — в это время GitHub чаще всего задерживает и пропускает cron.
    # Второй запуск — страховка: повтор в тот же день не дублирует срез, а обновляет его.
    - cron: "23 3 * * *"   # 06:23 по Минску
    - cron: "41 9 * * *"   # 12:41 по Минску
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write          # чтобы закоммитить обновлённый docs/data.json

concurrency: stats         # два запуска одновременно не пишут в один файл

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          DAYS_BACK: ${{ vars.DAYS_BACK }}
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/*.csv
          git diff --cached --quiet || git commit -m "Статистика за $(date -u +%F)"
          git push
